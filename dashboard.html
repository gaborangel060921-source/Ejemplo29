<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Panel Administrativo — SENA</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="admin-layout d-flex">

        <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

        <!-- ===================== SIDEBAR DE NAVEGACIÓN ===================== -->
        <div id="sidebar-container"></div>

        <!-- ===================== CONTENIDO PRINCIPAL ===================== -->
        <div class="admin-main">

            <header class="topbar d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center">
                    <button class="menu-toggle-btn" id="btnToggleSidebar" aria-label="Abrir menú">
                        <i class="bi bi-list"></i>
                    </button>
                    <div>
                        <h1 class="topbar-title">Dashboard</h1>
                        <p class="topbar-subtitle">Panel Administrativo</p>
                    </div>
                </div>

            </header>

            <main class="admin-content">

                <!-- Título y fecha actual -->
                <div class="mb-4">
                    <h2 class="page-title mb-1">Panel de Control</h2>
                    <p class="page-subtitle mb-0" id="fechaHoy"></p>
                </div>

                <!-- Tarjetas de estadísticas -->
                <div class="row g-3 mb-4">
                    <div class="col-6 col-md-4">
                        <div class="stat-card">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <div class="stat-label">Usuarios</div>
                                    <div class="stat-value">48</div>
                                </div>
                                <div class="stat-icon stat-icon-blue"><i class="bi bi-people-fill"></i></div>
                            </div>
                            <div class="stat-underline stat-underline-blue"></div>
                        </div>
                    </div>
                    <div class="col-6 col-md-4">
                        <div class="stat-card">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <div class="stat-label">Computadores</div>
                                    <div class="stat-value">35</div>
                                </div>
                                <div class="stat-icon stat-icon-teal"><i class="bi bi-laptop-fill"></i></div>
                            </div>
                            <div class="stat-underline stat-underline-teal"></div>
                        </div>
                    </div>
                    <div class="col-6 col-md-4">
                        <div class="stat-card">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <div class="stat-label">Vehículos</div>
                                    <div class="stat-value">22</div>
                                </div>
                                <div class="stat-icon stat-icon-purple"><i class="bi bi-car-front-fill"></i></div>
                            </div>
                            <div class="stat-underline stat-underline-purple"></div>
                        </div>
                    </div>

                    <div class="col-6 col-md-4">
                        <div class="stat-card">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <div class="stat-label">Ingresos Hoy</div>
                                    <div class="stat-value">127</div>
                                </div>
                                <div class="stat-icon stat-icon-green"><i class="bi bi-arrow-up"></i></div>
                            </div>
                            <div class="stat-underline stat-underline-green"></div>
                        </div>
                    </div>
                    <div class="col-6 col-md-4">
                        <div class="stat-card">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <div class="stat-label">Salidas Hoy</div>
                                    <div class="stat-value">98</div>
                                </div>
                                <div class="stat-icon stat-icon-orange"><i class="bi bi-arrow-down"></i></div>
                            </div>
                            <div class="stat-underline stat-underline-orange"></div>
                        </div>
                    </div>
                </div>

                <!-- Gráficos: actividad semanal + estado de equipos -->
                <div class="row g-3 mb-4">
                    <div class="col-lg-8">
                        <div class="panel-card h-100">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h3 class="panel-card-title">Actividad Semanal</h3>
                                <span class="panel-card-link">Ingresos y salidas</span>
                            </div>
                            <canvas id="graficoActividad" height="200"></canvas>
                        </div>
                    </div>
                </div>

                <!-- Últimos registros de acceso -->
                <div class="panel-card">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h3 class="panel-card-title">Últimos Registros de Acceso</h3>
                        <span class="panel-card-link">Día de hoy</span>
                    </div>
                    <div class="table-responsive">
                        <table class="table-custom">
                            <thead>
                                <tr>
                                    <th>Persona</th>
                                    <th>Hora</th>
                                    <th>Documento</th>
                                    <th>Evento</th>
                                    <th>Estado de elementos</th>
                                    <th>Centro</th>
                                    <th>Portero</th>

                                </tr>
                            </thead>
                            <tbody id="cuerpoTablaRegistros">
                                <!-- Filas generadas dinámicamente desde js/dashboard.js -->
                            </tbody>
                        </table>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Chart.js: librería usada solo para dibujar los gráficos del dashboard -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/componentes.js"></script>
</body>
</html>
